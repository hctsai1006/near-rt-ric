name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GO_VERSION: "1.21"
  NODE_VERSION: "18"
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # Code quality and security checks
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m --config=.golangci.yml

    - name: Run gosec security scanner
      uses: securecodewarrior/github-action-gosec@master
      with:
        args: '-no-fail -fmt sarif -out gosec.sarif ./...'

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: gosec.sarif

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Verify Go modules
      run: |
        go mod verify
        go mod tidy
        git diff --exit-code go.mod go.sum

  # Unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.19", "1.20", "1.21"]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: |
        go test -v -race -coverprofile=coverage.out -covermode=atomic -short ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

    - name: Generate coverage report
      run: |
        go tool cover -html=coverage.out -o coverage.html
        go tool cover -func=coverage.out | tail -1

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report-go${{ matrix.go-version }}
        path: |
          coverage.out
          coverage.html

  # Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: near_rt_ric_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Wait for services
      run: |
        timeout 60s bash -c 'until nc -z localhost 5432; do sleep 1; done'
        timeout 60s bash -c 'until nc -z localhost 6379; do sleep 1; done'

    - name: Run E2 interface tests
      env:
        TEST_DB_URL: postgres://test_user:test_password@localhost:5432/near_rt_ric_test?sslmode=disable
        TEST_REDIS_URL: redis://localhost:6379/0
      run: |
        go test -v -timeout=30m -tags=integration ./test/integration/e2/...

    - name: Run A1 interface tests
      env:
        TEST_DB_URL: postgres://test_user:test_password@localhost:5432/near_rt_ric_test?sslmode=disable
        TEST_REDIS_URL: redis://localhost:6379/0
      run: |
        go test -v -timeout=30m -tags=integration ./test/integration/a1/...

    - name: Run O1 interface tests
      env:
        TEST_DB_URL: postgres://test_user:test_password@localhost:5432/near_rt_ric_test?sslmode=disable
      run: |
        go test -v -timeout=30m -tags=integration ./test/integration/o1/...

    - name: Run xApp Manager tests
      env:
        TEST_DB_URL: postgres://test_user:test_password@localhost:5432/near_rt_ric_test?sslmode=disable
        TEST_REDIS_URL: redis://localhost:6379/0
      run: |
        go test -v -timeout=30m -tags=integration ./test/integration/xapp/...

  # Performance tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Start test services
      run: |
        docker-compose -f docker/docker-compose.test.yml up -d
        sleep 30

    - name: Run performance tests
      run: |
        go test -v -timeout=45m -tags=performance ./test/performance/...

    - name: Run benchmarks
      run: |
        go test -bench=. -benchmem -run=^$ ./... > benchmark-results.txt

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: |
          benchmark-results.txt

    - name: Cleanup test services
      if: always()
      run: |
        docker-compose -f docker/docker-compose.test.yml down -v

  # O-RAN compliance tests
  compliance-tests:
    name: O-RAN Compliance Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run compliance tests
      run: |
        go test -v -timeout=30m -tags=compliance ./test/compliance/...

    - name: Generate compliance report
      run: |
        echo "# O-RAN Compliance Test Results" > compliance-report.md
        echo "Generated on: $(date)" >> compliance-report.md
        echo "" >> compliance-report.md
        go test -v -tags=compliance ./test/compliance/... 2>&1 | \
          grep -E "(PASS|FAIL|===)" >> compliance-report.md || true

    - name: Upload compliance report
      uses: actions/upload-artifact@v3
      with:
        name: compliance-report
        path: compliance-report.md

  # Frontend tests (Angular)
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run unit tests
      run: npm run test:ci

    - name: Run e2e tests
      run: npm run e2e:ci

    - name: Build application
      run: npm run build:prod

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: web-build
        path: web/dist/

  # Docker build and security scan
  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    strategy:
      matrix:
        component: [main, e2-interface, a1-interface, o1-interface, xapp-manager]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ matrix.component }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-${{ matrix.component }}-

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.${{ matrix.component }}
        tags: near-rt-ric/${{ matrix.component }}:${{ github.sha }}
        load: true
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
        build-args: |
          VERSION=${{ github.sha }}
          BUILD_TIME=${{ github.run_number }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'near-rt-ric/${{ matrix.component }}:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-results-${{ matrix.component }}.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results-${{ matrix.component }}.sarif'

    - name: Test Docker image
      run: |
        docker run --rm near-rt-ric/${{ matrix.component }}:${{ github.sha }} --version || true
        docker run --rm near-rt-ric/${{ matrix.component }}:${{ github.sha }} --health-check || true

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # Kubernetes manifests validation
  k8s-validation:
    name: Kubernetes Manifests Validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Validate Kubernetes manifests
      run: |
        kubectl --dry-run=client apply -f k8s/

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Lint Helm charts
      run: |
        helm lint helm/near-rt-ric/

    - name: Template Helm charts
      run: |
        helm template test-release helm/near-rt-ric/ > rendered-manifests.yaml

    - name: Validate rendered manifests
      run: |
        kubectl --dry-run=client apply -f rendered-manifests.yaml

    - name: Run Helm tests
      run: |
        helm install test-release helm/near-rt-ric/ --dry-run --debug

  # Release preparation
  release-preparation:
    name: Release Preparation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [code-quality, unit-tests, integration-tests, docker-build, k8s-validation]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Generate changelog
      run: |
        echo "# Changelog" > CHANGELOG.md
        echo "Generated on: $(date)" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        git log --pretty=format:"- %s (%h)" --since="1 week ago" >> CHANGELOG.md

    - name: Build release binaries
      run: |
        mkdir -p release
        GOOS=linux GOARCH=amd64 go build -o release/near-rt-ric-linux-amd64 ./cmd/ric/
        GOOS=linux GOARCH=arm64 go build -o release/near-rt-ric-linux-arm64 ./cmd/ric/
        GOOS=darwin GOARCH=amd64 go build -o release/near-rt-ric-darwin-amd64 ./cmd/ric/
        GOOS=darwin GOARCH=arm64 go build -o release/near-rt-ric-darwin-arm64 ./cmd/ric/

    - name: Generate checksums
      run: |
        cd release
        sha256sum * > checksums.txt

    - name: Upload release artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-artifacts
        path: |
          release/
          CHANGELOG.md