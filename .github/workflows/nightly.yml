name: Nightly Operations

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  GO_VERSION: "1.21"

jobs:
  # Comprehensive security scan
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run comprehensive security audit
      run: |
        # Update security databases
        go install github.com/securecodewarrior/github-action-gosec/v2/cmd/gosec@latest
        go install github.com/sonatype-nexus-community/nancy@latest
        
        # Run gosec with all rules
        gosec -fmt json -out gosec-report.json ./...
        
        # Run nancy for dependency vulnerabilities
        go list -json -deps ./... | nancy sleuth --output-format json > nancy-report.json
        
        # Check for leaked secrets
        docker run --rm -v $(pwd):/src trufflesecurity/trufflehog:latest github --repo=file:///src --json > secrets-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: nightly-security-reports
        path: |
          gosec-report.json
          nancy-report.json
          secrets-report.json

    - name: Check license compliance
      run: |
        go install github.com/google/licensecheck@latest
        licensecheck -copyright ./... > license-report.txt

    - name: Upload license report
      uses: actions/upload-artifact@v3
      with:
        name: license-report
        path: license-report.txt

  # Performance regression testing
  performance-regression:
    name: Performance Regression Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Start test services
      run: |
        docker-compose -f docker/docker-compose.test.yml up -d
        sleep 30

    - name: Run performance benchmarks
      run: |
        # Run benchmarks and save results
        go test -bench=. -benchmem -count=5 -run=^$ ./... > benchmark-$(date +%Y%m%d).txt
        
        # Run performance tests with extended duration
        go test -v -timeout=60m -tags=performance ./test/performance/... \
          -extended-duration=30m \
          -high-load=true

    - name: Compare with baseline
      run: |
        # Download previous benchmark results (if available)
        # This would typically compare against stored baseline results
        echo "Comparing performance with baseline..."
        
        # Generate performance report
        echo "# Performance Report - $(date)" > performance-report.md
        echo "" >> performance-report.md
        echo "## Benchmark Results" >> performance-report.md
        cat benchmark-$(date +%Y%m%d).txt >> performance-report.md

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-regression-results
        path: |
          benchmark-*.txt
          performance-report.md

    - name: Cleanup test services
      if: always()
      run: |
        docker-compose -f docker/docker-compose.test.yml down -v

  # Dependency update check
  dependency-check:
    name: Dependency Update Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Check for Go dependency updates
      run: |
        # Check for outdated Go modules
        go list -u -m all > go-dependencies.txt
        
        # Check for security updates
        go list -json -deps ./... | nancy sleuth --output-format json > dependency-vulnerabilities.json

    - name: Set up Node.js for frontend dependencies
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Check for npm dependency updates
      run: |
        cd web
        npm outdated > ../npm-dependencies.txt || true
        npm audit --audit-level=moderate --json > ../npm-audit.json || true

    - name: Check Docker base image updates
      run: |
        # Check for base image updates
        echo "# Docker Base Image Updates" > docker-updates.md
        echo "" >> docker-updates.md
        
        # Extract FROM statements and check for updates
        grep -r "FROM" docker/ | while read line; do
          echo "Checking: $line" >> docker-updates.md
        done

    - name: Generate dependency update report
      run: |
        echo "# Dependency Update Report - $(date)" > dependency-report.md
        echo "" >> dependency-report.md
        
        echo "## Go Dependencies" >> dependency-report.md
        cat go-dependencies.txt >> dependency-report.md
        
        echo "" >> dependency-report.md
        echo "## NPM Dependencies" >> dependency-report.md
        cat npm-dependencies.txt >> dependency-report.md
        
        echo "" >> dependency-report.md
        echo "## Docker Updates" >> dependency-report.md
        cat docker-updates.md >> dependency-report.md

    - name: Upload dependency reports
      uses: actions/upload-artifact@v3
      with:
        name: dependency-update-reports
        path: |
          dependency-report.md
          dependency-vulnerabilities.json
          npm-audit.json

  # Code quality metrics
  code-quality-metrics:
    name: Code Quality Metrics
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Calculate code metrics
      run: |
        # Install gocyclo for cyclomatic complexity
        go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
        
        # Install gocloc for lines of code
        go install github.com/hhatto/gocloc/cmd/gocloc@latest
        
        # Install ineffassign for ineffectual assignments
        go install github.com/gordonklaus/ineffassign@latest
        
        # Calculate metrics
        echo "# Code Quality Metrics - $(date)" > metrics-report.md
        echo "" >> metrics-report.md
        
        echo "## Lines of Code" >> metrics-report.md
        gocloc . >> metrics-report.md
        
        echo "" >> metrics-report.md
        echo "## Cyclomatic Complexity (>15)" >> metrics-report.md
        gocyclo -over 15 . >> metrics-report.md
        
        echo "" >> metrics-report.md
        echo "## Ineffectual Assignments" >> metrics-report.md
        ineffassign . >> metrics-report.md || true

    - name: Run full test coverage
      run: |
        # Generate comprehensive coverage report
        go test -coverprofile=coverage-full.out -covermode=atomic ./...
        go tool cover -html=coverage-full.out -o coverage-full.html
        go tool cover -func=coverage-full.out > coverage-summary.txt

    - name: Upload code quality reports
      uses: actions/upload-artifact@v3
      with:
        name: code-quality-metrics
        path: |
          metrics-report.md
          coverage-full.out
          coverage-full.html
          coverage-summary.txt

  # Database maintenance and testing
  database-maintenance:
    name: Database Maintenance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: near_rt_ric_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Test database migrations
      env:
        TEST_DB_URL: postgres://test_user:test_password@localhost:5432/near_rt_ric_test?sslmode=disable
      run: |
        # Test forward migrations
        go run ./scripts/migrate.go --up --test
        
        # Test rollback migrations
        go run ./scripts/migrate.go --down --steps=1 --test
        go run ./scripts/migrate.go --up --test

    - name: Test database performance
      env:
        TEST_DB_URL: postgres://test_user:test_password@localhost:5432/near_rt_ric_test?sslmode=disable
      run: |
        # Run database performance tests
        go test -v -timeout=30m -tags=database ./test/database/...

    - name: Generate database report
      run: |
        echo "# Database Health Report - $(date)" > database-report.md
        echo "" >> database-report.md
        echo "✅ Migration tests passed" >> database-report.md
        echo "✅ Performance tests completed" >> database-report.md

    - name: Upload database reports
      uses: actions/upload-artifact@v3
      with:
        name: database-maintenance-reports
        path: database-report.md

  # Container security scanning
  container-security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [main, e2-interface, a1-interface, o1-interface, xapp-manager, web]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image for scanning
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.${{ matrix.component }}
        tags: scan-${{ matrix.component }}:latest
        load: true

    - name: Run Trivy comprehensive scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'scan-${{ matrix.component }}:latest'
        format: 'json'
        output: 'trivy-${{ matrix.component }}.json'

    - name: Run Grype scan
      uses: anchore/scan-action@v3
      with:
        image: 'scan-${{ matrix.component }}:latest'
        output-format: json
        output-file: grype-${{ matrix.component }}.json

    - name: Run Syft SBOM generation
      uses: anchore/sbom-action@v0
      with:
        image: 'scan-${{ matrix.component }}:latest'
        format: spdx-json
        output-file: sbom-${{ matrix.component }}.spdx.json

    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      with:
        name: container-security-${{ matrix.component }}
        path: |
          trivy-${{ matrix.component }}.json
          grype-${{ matrix.component }}.json
          sbom-${{ matrix.component }}.spdx.json

  # Infrastructure as Code validation
  iac-validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: Validate Terraform configurations
      run: |
        if [ -d "terraform/" ]; then
          cd terraform/
          terraform init -backend=false
          terraform validate
          terraform fmt -check
        else
          echo "No Terraform configurations found"
        fi

    - name: Scan IaC with Checkov
      uses: bridgecrewio/checkov-action@master
      with:
        directory: .
        framework: kubernetes,dockerfile,helm
        output_format: json
        output_file_path: checkov-report.json

    - name: Validate Kubernetes manifests with Polaris
      run: |
        # Install Polaris
        curl -L https://github.com/FairwindsOps/polaris/releases/latest/download/polaris_linux_amd64.tar.gz | tar xz
        
        # Run Polaris validation
        ./polaris audit --audit-path k8s/ --format json > polaris-report.json

    - name: Upload IaC validation results
      uses: actions/upload-artifact@v3
      with:
        name: iac-validation-reports
        path: |
          checkov-report.json
          polaris-report.json

  # Documentation update check
  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check documentation freshness
      run: |
        # Find markdown files older than 30 days
        find . -name "*.md" -mtime +30 > old-docs.txt
        
        # Check for TODO items in documentation
        grep -r "TODO\|FIXME\|XXX" --include="*.md" . > doc-todos.txt || true
        
        # Check for broken links (placeholder - would use real link checker)
        echo "Checking for broken links..." > link-check.txt

    - name: Generate documentation report
      run: |
        echo "# Documentation Health Report - $(date)" > doc-report.md
        echo "" >> doc-report.md
        
        echo "## Outdated Documentation (>30 days)" >> doc-report.md
        cat old-docs.txt >> doc-report.md
        
        echo "" >> doc-report.md
        echo "## TODOs in Documentation" >> doc-report.md
        cat doc-todos.txt >> doc-report.md

    - name: Upload documentation report
      uses: actions/upload-artifact@v3
      with:
        name: documentation-report
        path: |
          doc-report.md
          old-docs.txt
          doc-todos.txt

  # Generate comprehensive nightly report
  generate-nightly-report:
    name: Generate Nightly Report
    runs-on: ubuntu-latest
    needs: [
      security-audit,
      performance-regression,
      dependency-check,
      code-quality-metrics,
      database-maintenance,
      container-security-scan,
      iac-validation,
      documentation-check
    ]
    if: always()
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Generate comprehensive report
      run: |
        echo "# O-RAN Near-RT RIC Nightly Report - $(date)" > nightly-report.md
        echo "" >> nightly-report.md
        
        echo "## Summary" >> nightly-report.md
        echo "- Security Audit: ${{ needs.security-audit.result }}" >> nightly-report.md
        echo "- Performance Regression: ${{ needs.performance-regression.result }}" >> nightly-report.md
        echo "- Dependency Check: ${{ needs.dependency-check.result }}" >> nightly-report.md
        echo "- Code Quality: ${{ needs.code-quality-metrics.result }}" >> nightly-report.md
        echo "- Database Maintenance: ${{ needs.database-maintenance.result }}" >> nightly-report.md
        echo "- Container Security: ${{ needs.container-security-scan.result }}" >> nightly-report.md
        echo "- IaC Validation: ${{ needs.iac-validation.result }}" >> nightly-report.md
        echo "- Documentation Check: ${{ needs.documentation-check.result }}" >> nightly-report.md
        echo "" >> nightly-report.md
        
        # Add detailed sections
        echo "## Detailed Reports" >> nightly-report.md
        echo "See attached artifacts for detailed analysis." >> nightly-report.md

    - name: Upload comprehensive report
      uses: actions/upload-artifact@v3
      with:
        name: nightly-comprehensive-report
        path: nightly-report.md

    - name: Send notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          🌙 Near-RT RIC Nightly Report Complete
          
          Results:
          - Security: ${{ needs.security-audit.result }}
          - Performance: ${{ needs.performance-regression.result }}
          - Dependencies: ${{ needs.dependency-check.result }}
          - Code Quality: ${{ needs.code-quality-metrics.result }}
          
          Full report available in workflow artifacts.
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Cleanup old artifacts and logs
  cleanup-artifacts:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    steps:
    - name: Delete old workflow runs
      uses: actions/github-script@v6
      with:
        script: |
          // Keep last 30 workflow runs
          const runs = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'nightly.yml',
            per_page: 100
          });
          
          const runsToDelete = runs.data.workflow_runs.slice(30);
          
          for (const run of runsToDelete) {
            if (run.status === 'completed') {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
            }
          }