run:
  timeout: 5m
  tests: false
  skip-dirs:
    - vendor
    - node_modules
    - .git
  skip-files:
    - ".*_test.go$"

linters-settings:
  govet:
    check-shadowing: false
  golint:
    min-confidence: 0.8
  gocyclo:
    min-complexity: 15
  dupl:
    threshold: 100
  goconst:
    min-len: 2
    min-occurrences: 2
  misspell:
    locale: US
  lll:
    line-length: 140
  goimports:
    local-prefixes: github.com/hctsai1006/near-rt-ric
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style

linters:
  enable:
    - bodyclose
    - deadcode
    - depguard
    - dogsled
    - dupl
    - errcheck
    - gochecknoinits
    - goconst
    - gocritic
    - gofmt
    - goimports
    - golint
    - gomnd
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    - interfacer
    - lll
    - misspell
    - nakedret
    - rowserrcheck
    - staticcheck
    - structcheck
    - stylecheck
    - typecheck
    - unconvert
    - unparam
    - unused
    - varcheck
    - whitespace

issues:
  exclude-rules:
    # Disable linting for known issues during transition
    - path: pkg/a1/
      linters:
        - typecheck
    - path: pkg/o1/
      linters:  
        - typecheck
    - path: pkg/xapp/
      linters:
        - typecheck
    - path: cmd/
      linters:
        - typecheck
  exclude:
    # Standard excludes
    - "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*printf?|os\\.(Un)?Setenv). is not checked"
    # Ignore missing comments for now
    - "exported .* should have comment.*or be unexported"
    # Allow complex functions during refactoring
    - "cyclomatic complexity .* of func .* is high"

severity:
  default-severity: warning