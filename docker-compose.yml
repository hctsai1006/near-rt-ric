# Docker Compose for O-RAN Near-RT RIC Development Environment
# Complete stack with all interfaces and dependencies

version: '3.8'

services:
  # PostgreSQL database for persistent storage
  postgres:
    image: postgres:15-alpine
    container_name: oran-postgres
    environment:
      POSTGRES_DB: near_rt_ric
      POSTGRES_USER: ric_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - ric_network
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ric_user -d near_rt_ric"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # InfluxDB for time-series metrics
  influxdb:
    image: influxdb:2.7-alpine
    container_name: oran-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influxdb_password
      DOCKER_INFLUXDB_INIT_ORG: o-ran
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      - ric_network
    secrets:
      - influxdb_password
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: oran-redis
    command: |
      sh -c 'redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ric_network
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Apache Kafka for message routing
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: oran-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - ric_network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: oran-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    ports:
      - "2181:2181"
    networks:
      - ric_network
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Main Near-RT RIC service
  near-rt-ric:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: oran-near-rt-ric
    depends_on:
      - postgres
      - influxdb
      - redis
      - kafka
    environment:
      - CONFIG_PATH=/app/configs/ric-config.yaml
      - DB_HOST=postgres
      - DB_NAME=near_rt_ric
      - DB_USER=ric_user
      - DB_PASSWORD_FILE=/run/secrets/postgres_password
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN_FILE=/run/secrets/influxdb_token
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - KAFKA_BROKERS=kafka:9092
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ric_data:/app/data
    ports:
      - "8080:8080"   # HTTP API
      - "8443:8443"   # HTTPS API
      - "830:830"     # NETCONF
      - "2152:2152"   # E2 SCTP
      - "40000:40000" # Debug port
    networks:
      - ric_network
    secrets:
      - postgres_password
      - influxdb_token
      - redis_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # E2 Interface Service
  e2-interface:
    build:
      context: .
      dockerfile: docker/Dockerfile.e2-interface
    container_name: oran-e2-interface
    depends_on:
      - postgres
      - influxdb
    environment:
      - CONFIG_PATH=/app/configs/e2-config.yaml
      - DB_HOST=postgres
      - INFLUX_URL=http://influxdb:8086
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    ports:
      - "36421:36421"  # E2 SCTP primary
      - "36422:36422"  # E2 SCTP secondary
    networks:
      - ric_network
    healthcheck:
      test: ["CMD", "./e2-interface", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # A1 Interface Service
  a1-interface:
    build:
      context: .
      dockerfile: docker/Dockerfile.a1-interface
    container_name: oran-a1-interface
    depends_on:
      - postgres
      - redis
    environment:
      - CONFIG_PATH=/app/configs/a1-config.yaml
      - DB_HOST=postgres
      - REDIS_ADDR=redis:6379
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./policies:/app/policies
    ports:
      - "8081:8080"  # A1 HTTP API
      - "8444:8443"  # A1 HTTPS API
    networks:
      - ric_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/a1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # O1 Interface Service
  o1-interface:
    build:
      context: .
      dockerfile: docker/Dockerfile.o1-interface
    container_name: oran-o1-interface
    depends_on:
      - postgres
    environment:
      - CONFIG_PATH=/app/configs/o1-config.yaml
      - DB_HOST=postgres
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./yang:/app/yang
    ports:
      - "831:830"    # NETCONF SSH
      - "6513:6513"  # NETCONF TLS
    networks:
      - ric_network
    healthcheck:
      test: ["CMD", "./o1-interface", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # xApp Manager Service
  xapp-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.xapp-manager
    container_name: oran-xapp-manager
    depends_on:
      - postgres
      - kafka
    environment:
      - CONFIG_PATH=/app/configs/xapp-config.yaml
      - DB_HOST=postgres
      - KAFKA_BROKERS=kafka:9092
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-based xApp deployment
    ports:
      - "8088:8088"  # xApp Manager API
      - "8089:8089"  # xApp Manager management
    networks:
      - ric_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: oran-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ric_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 15s
      retries: 3
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.0.0
    container_name: oran-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    networks:
      - ric_network
    secrets:
      - grafana_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  ric_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  influxdb_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  ric_data:
  prometheus_data:
  grafana_data:

secrets:
  postgres_password:
    external: true
    name: postgres_password
  influxdb_password:
    external: true
    name: influxdb_password
  influxdb_token:
    external: true
    name: influxdb_token
  redis_password:
    external: true
    name: redis_password
  grafana_password:
    external: true
    name: grafana_password