apiVersion: v2
name: near-rt-ric
description: A Helm chart for the O-RAN Near-RT RIC
type: application
version: 0.1.0
appVersion: "1.0.0"
icon: https://www.o-ran.org/images/o-ran-logo.png
home: https://github.com/hctsai1006/near-rt-ric
sources:
  - https://github.com/hctsai1006/near-rt-ric
maintainers:
  - name: O-RAN Near-RT RIC Team
    email: ric-team@example.com
keywords:
  - o-ran
  - near-rt-ric
  - 5g
  - ran
  - telecommunications
dependencies:
  - name: postgresql
    version: "12.8.2"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "17.11.3"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: kafka
    version: "22.1.5"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
  - name: prometheus
    version: "23.1.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "6.58.7"
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.grafana.enabled
annotations:
  category: Telecommunications
  licenses: Apache-2.0