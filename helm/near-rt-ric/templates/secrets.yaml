{{- if or (include "near-rt-ric.createTLSSecret" .) (not .Values.ingress.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "near-rt-ric.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "near-rt-ric.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- include "near-rt-ric.gen-certs" . | nindent 2 }}
{{- end }}

---
# JWT Secret for authentication
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "near-rt-ric.fullname" . }}-jwt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "near-rt-ric.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ randAlphaNum 64 | b64enc }}

---
# Database credentials (if using external database)
{{- if not .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "near-rt-ric.fullname" . }}-database
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "near-rt-ric.labels" . | nindent 4 }}
type: Opaque
data:
  # These should be provided via values or external secret management
  username: {{ "ric_user" | b64enc }}
  password: {{ "change_me_in_production" | b64enc }}
  database: {{ "near_rt_ric" | b64enc }}
  host: {{ "localhost" | b64enc }}
{{- end }}

---
# Redis credentials (if using external Redis)
{{- if not .Values.redis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "near-rt-ric.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "near-rt-ric.labels" . | nindent 4 }}
type: Opaque
data:
  redis-password: {{ "change_me_in_production" | b64enc }}
{{- end }}

---
# InfluxDB credentials (if using external InfluxDB)
{{- if not .Values.influxdb.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "near-rt-ric.fullname" . }}-influxdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "near-rt-ric.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ "change_me_in_production" | b64enc }}
  admin-token: {{ randAlphaNum 32 | b64enc }}
  user-password: {{ "change_me_in_production" | b64enc }}
  user-token: {{ randAlphaNum 32 | b64enc }}
{{- end }}

---
# O1 Interface SSH keys
{{- if .Values.interfaces.o1.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "near-rt-ric.fullname" . }}-o1-ssh
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "near-rt-ric.labels" . | nindent 4 }}
    app.kubernetes.io/component: o1
type: Opaque
data:
  # SSH host key for NETCONF server
  ssh_host_rsa_key: {{ randAlphaNum 2048 | b64enc }}
  ssh_host_rsa_key.pub: {{ randAlphaNum 512 | b64enc }}
  # NETCONF user credentials
  netconf_user: {{ "netconf" | b64enc }}
  netconf_password: {{ randAlphaNum 32 | b64enc }}
{{- end }}

---
# xApp Manager Service Account Token (for Kubernetes API access)
{{- if .Values.interfaces.xapp.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "near-rt-ric.fullname" . }}-xapp-sa-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "near-rt-ric.labels" . | nindent 4 }}
    app.kubernetes.io/component: xapp
  annotations:
    kubernetes.io/service-account.name: {{ include "near-rt-ric.serviceAccountName" . }}
type: kubernetes.io/service-account-token
{{- end }}

---
# Monitoring credentials
{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "near-rt-ric.fullname" . }}-monitoring
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "near-rt-ric.labels" . | nindent 4 }}
type: Opaque
data:
  # Basic auth for metrics endpoints
  metrics-username: {{ "metrics" | b64enc }}
  metrics-password: {{ randAlphaNum 32 | b64enc }}
  # Alert manager webhook URL (if using external alert manager)
  alertmanager-webhook: {{ "" | b64enc }}
{{- end }}

---
# E2 Interface certificates for secure communication
{{- if .Values.interfaces.e2.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "near-rt-ric.fullname" . }}-e2-certs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "near-rt-ric.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2
type: kubernetes.io/tls
data:
  # Generate certificates specifically for E2 interface
  {{- $altNames := list ( printf "%s-e2.%s" (include "near-rt-ric.fullname" .) .Release.Namespace ) ( printf "%s-e2.%s.svc" (include "near-rt-ric.fullname" .) .Release.Namespace ) -}}
  {{- $ca := genCA "e2-interface-ca" 365 -}}
  {{- $cert := genSignedCert ( printf "%s-e2" (include "near-rt-ric.fullname" .) ) nil $altNames 365 $ca -}}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}

---
# Configuration encryption key
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "near-rt-ric.fullname" . }}-config-encryption
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "near-rt-ric.labels" . | nindent 4 }}
type: Opaque
data:
  # AES-256 key for sensitive configuration encryption
  encryption-key: {{ randAlphaNum 32 | b64enc }}
  # HMAC key for configuration integrity
  hmac-key: {{ randAlphaNum 32 | b64enc }}

---
# Webhook certificates for admission controllers
{{- if .Values.interfaces.xapp.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "near-rt-ric.fullname" . }}-webhook-certs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "near-rt-ric.labels" . | nindent 4 }}
    app.kubernetes.io/component: xapp
type: kubernetes.io/tls
data:
  # Generate certificates for admission webhook
  {{- $webhookAltNames := list ( printf "%s-xapp-webhook.%s.svc" (include "near-rt-ric.fullname" .) .Release.Namespace ) ( printf "%s-xapp-webhook.%s.svc.cluster.local" (include "near-rt-ric.fullname" .) .Release.Namespace ) -}}
  {{- $webhookCA := genCA "xapp-webhook-ca" 365 -}}
  {{- $webhookCert := genSignedCert ( printf "%s-xapp-webhook" (include "near-rt-ric.fullname" .) ) nil $webhookAltNames 365 $webhookCA -}}
  tls.crt: {{ $webhookCert.Cert | b64enc }}
  tls.key: {{ $webhookCert.Key | b64enc }}
  ca.crt: {{ $webhookCA.Cert | b64enc }}
{{- end }}